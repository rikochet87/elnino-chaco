# Vientos, humedad y lluvia promedio de los veranos con El Niño (página 3D).
# Se corre a mano desde la pestaña Actions de GitHub: una vez, y después de cada verano Niño nuevo.
name: Vientos y lluvia de los veranos Niño

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos-web
  cancel-in-progress: false

jobs:
  atmosfera:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline atmosfera
      - name: Subir el resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/atmosfera.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Vientos y lluvia de los veranos Niño"
          git pull --rebase
          git push
