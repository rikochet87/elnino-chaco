# Imagen satelital del globo (NASA Blue Marble). Se corre a mano una sola vez.
name: Imagen satelital del globo

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos-web
  cancel-in-progress: false

jobs:
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python scripts/imagen_satelital.py
      - name: Subir la imagen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/imagen
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Imagen satelital del globo (NASA Blue Marble)"
          git pull --rebase
          git push
