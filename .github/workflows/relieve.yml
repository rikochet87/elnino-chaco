# Relieve de Sudamérica (NOAA ETOPO) para la página 3D. Se corre a mano una sola vez.
name: Relieve de Sudamérica

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos-web
  cancel-in-progress: false

jobs:
  relieve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/relieve.py
      - name: Subir el relieve
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/relieve_sa.png docs/data/relieve_sa.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Relieve de Sudamérica (NOAA ETOPO)"
          git pull --rebase
          git push
